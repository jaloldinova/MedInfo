<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dori Qidirish</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f0f8ff;
        }
        .card {
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .search-btn {
            background: #007bff;
            color: white;
        }
        .search-btn:hover {
            background: #0056b3;
            color: white;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4 text-primary">Dori Qidirish Tizimi</h1>

    <form method="GET">
        <div class="input-group mb-3">
            <input type="text" name="q" class="form-control" placeholder="Dori nomini yozing..." value="{{ query }}">
            <button class="btn search-btn" type="submit">Qidirish</button>
        </div>
    </form>

    {% if drug %}
        <div class="card mb-3">
            <div class="row g-0">
                {% if drug.image %}
                <div class="col-md-4">
                    <img src="{{ drug.image.url }}" class="img-fluid rounded-start" alt="{{ drug.name }}">
                </div>
                {% endif %}
                <div class="col-md-8">
                    <div class="card-body">
                        <h3 class="card-title text-success">{{ drug.name }}</h3>

                        <p><strong>Dori haqida:</strong><br>
                        {{ drug.description }}</p>

                        <p><strong>Nimaga ishlatiladi:</strong><br>
                        {{ drug.usage }}</p>

                        <p><strong>Nojo'ya ta'siri:</strong><br>
                        {{ drug.side_effects }}</p>

                    </div>
                </div>
            </div>
        </div>

    {% elif query %}
        <div class="alert alert-danger">
            Bunday dori topilmadi
        </div>
    {% endif %}
</div>

</body>
</html>
